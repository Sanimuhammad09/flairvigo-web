<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - Flair Vigo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary-fixed": "#2c1600",
                        "surface-container-high": "#eae7e7",
                        "surface-dim": "#dcd9d9",
                        "surface-tint": "#8a4e4a",
                        "ink-deep": "#340A0A",
                        "on-surface-variant": "#524342",
                        "secondary-fixed": "#ffdcbd",
                        "on-primary-fixed": "#370d0c",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary": "#000000",
                        "error": "#ba1a1a",
                        "primary-fixed": "#ffdad7",
                        "on-tertiary-fixed-variant": "#4a4737",
                        "background": "#fcf9f8",
                        "secondary-fixed-dim": "#f4bc84",
                        "on-primary-fixed-variant": "#6d3734",
                        "on-background": "#1b1c1c",
                        "neutral-light": "#F4F4F4",
                        "inverse-primary": "#ffb3ae",
                        "surface-container-low": "#f6f3f2",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#643e12",
                        "surface-bright": "#fcf9f8",
                        "secondary-container": "#fdc48c",
                        "secondary": "#7f5527",
                        "surface-cream": "#FFF9E3",
                        "primary-container": "#370d0c",
                        "surface-container-highest": "#e4e2e1",
                        "inverse-surface": "#303030",
                        "on-tertiary-fixed": "#1e1c0f",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#b5726e",
                        "on-secondary-container": "#784f21",
                        "on-surface": "#1b1c1c",
                        "outline-variant": "#d7c2c0",
                        "on-tertiary-container": "#888472",
                        "outline": "#857371",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#ffb3ae",
                        "surface": "#fcf9f8",
                        "tertiary-fixed": "#e8e3cd",
                        "tertiary-container": "#1e1c0f",
                        "primary": "#000000",
                        "accent-gold": "#AD7D4B",
                        "surface-variant": "#e4e2e1",
                        "tertiary-fixed-dim": "#ccc7b2",
                        "surface-container": "#f0eded"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "section-gap-md": "80px",
                        "section-gap-lg": "120px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "container-max": "1440px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "body-md": ["Manrope"],
                        "label-bold": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #FFF9E3 inset !important;
            -webkit-text-fill-color: #340A0A !important;
        }
    </style>
</head>
<body class="bg-surface-cream text-ink-deep font-body-md min-h-screen flex selection:bg-accent-gold/20 selection:text-ink-deep">
<!-- Note: TopNavBar is suppressed because this is a transactional (Sign In) screen -->
<main class="flex w-full min-h-screen">
<!-- Left Side: Image Canvas (Hidden on mobile) -->
<section class="hidden lg:flex w-1/2 relative bg-ink-deep overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center opacity-90 transition-transform duration-[10s] hover:scale-105 origin-center" data-alt="A high-fashion editorial style photograph of medical professionals in premium deep burgundy scrubs. The lighting is dramatic and moody, emphasizing the luxurious texture of the fabric. The environment is abstract and minimalist, conveying a sense of technical luxury and precision engineering. The color palette focuses on rich deep burgundy, warm charcoal, and soft highlights, perfectly aligning with the Flair Vigo brand identity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBC_-I192bwbv8lxO0tdC2-PvJ2soeP_5mlFjtv-aNBwwoz19hEYr1N2g_rcD_bZvM8lNQ2pksNyqH5GL4gTUSkimufyQl1x56TweBasMfY2_SsFyPuzvH0ZAJg3d4vuVKs09CB6_BpsGoUOOzP1QvDnm7xXptlOnG1YOtnQAiwn4771pkk9qk_VqpzBGba2Vhl2-bGxCf14XD0SXod9kbB3SHlFZCD3YY9kXLpTjQn7JVNitJwgPXkkQ')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-ink-deep/80 via-ink-deep/20 to-transparent"></div>
<div class="relative z-10 p-margin-desktop flex flex-col justify-between h-full w-full">
<a class="font-headline-md text-headline-md font-bold text-surface-cream tracking-tight hover:opacity-80 transition-opacity w-max" href="#">
                    Flair Vigo
                </a>
<div class="max-w-md">
<h1 class="font-display-lg text-display-lg text-surface-cream mb-4">Precision in every thread.</h1>
<p class="font-body-lg text-body-lg text-surface-cream/80">Experience medical apparel engineered for high performance and uncompromising style.</p>
</div>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-cream">
<div class="w-full max-w-[440px] space-y-12">
<!-- Mobile Logo (Hidden on desktop) -->
<div class="lg:hidden flex justify-center mb-12">
<a class="font-headline-md text-headline-md font-bold text-ink-deep tracking-tight" href="#">
                        Flair Vigo
                    </a>
</div>
<div class="space-y-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-ink-deep">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<form class="space-y-6">
<div class="space-y-6">
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b border-ink-deep/20 pt-6 pb-2 px-0 text-ink-deep font-body-md focus:ring-0 focus:border-accent-gold transition-colors duration-300 placeholder-transparent" id="email" name="email" placeholder="Email address" required="" type="email"/>
<label class="absolute left-0 top-6 text-on-surface-variant font-body-md transition-all duration-300 peer-focus:-top-2 peer-focus:text-label-sm peer-focus:font-label-sm peer-focus:text-accent-gold peer-valid:-top-2 peer-valid:text-label-sm peer-valid:font-label-sm" for="email">
                                Email address
                            </label>
</div>
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b border-ink-deep/20 pt-6 pb-2 px-0 text-ink-deep font-body-md focus:ring-0 focus:border-accent-gold transition-colors duration-300 placeholder-transparent" id="password" name="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-0 top-6 text-on-surface-variant font-body-md transition-all duration-300 peer-focus:-top-2 peer-focus:text-label-sm peer-focus:font-label-sm peer-focus:text-accent-gold peer-valid:-top-2 peer-valid:text-label-sm peer-valid:font-label-sm" for="password">
                                Password
                            </label>
<button aria-label="Toggle password visibility" class="absolute right-0 top-6 text-ink-deep/40 hover:text-ink-deep transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<div class="flex items-center gap-3">
<div class="relative flex items-center">
<input class="peer appearance-none w-4 h-4 border border-ink-deep/20 rounded-none checked:bg-ink-deep checked:border-ink-deep cursor-pointer focus:ring-1 focus:ring-ink-deep/30 focus:ring-offset-2 focus:ring-offset-surface-cream transition-all" id="remember" name="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute text-surface-cream text-[14px] pointer-events-none opacity-0 peer-checked:opacity-100 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 transition-opacity">check</span>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember for 30 days</label>
</div>
<a class="font-label-bold text-label-bold text-ink-deep hover:text-accent-gold transition-colors underline underline-offset-4 decoration-1 decoration-ink-deep/30 hover:decoration-accent-gold" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-ink-deep text-surface-cream font-label-bold text-label-bold py-4 px-8 mt-8 hover:bg-ink-deep/90 active:scale-[0.99] transition-all duration-200 flex justify-center items-center gap-2 group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="text-center mt-12 pt-8 border-t border-ink-deep/10">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-bold text-label-bold text-ink-deep ml-1 hover:text-accent-gold transition-colors underline underline-offset-4 decoration-1 decoration-ink-deep/30 hover:decoration-accent-gold" href="#">Create an Account</a>
</p>
</div>
</div>
</section>
</main>
<!-- Note: Footer is suppressed because this is a transactional (Sign In) screen -->
</body></html>
