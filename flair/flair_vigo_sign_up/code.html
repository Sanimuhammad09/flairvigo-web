        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-surface-cream text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- Note: TopNavBar and Footer are suppressed as this is a transactional Signup screen -->
<main class="flex-grow flex w-full">
<div class="w-full flex flex-col md:flex-row min-h-screen">
<!-- Left Side: Form Area -->
<div class="w-full md:w-1/2 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-section-gap-md relative z-10 bg-surface-cream">
<div class="absolute top-margin-mobile md:top-margin-desktop left-margin-mobile md:left-margin-desktop">
<a class="font-headline-md text-headline-md font-bold text-ink-deep" href="#">Flair Vigo</a>
</div>
<div class="max-w-md w-full mx-auto mt-12 md:mt-0">
<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-ink-deep mb-2">Join the Community</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign up to access exclusive updates, curated collections, and a refined shopping experience.</p>
</div>
<form class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface" for="firstName">First Name</label>
<input class="w-full bg-transparent border-b border-on-surface-variant/20 py-2 px-0 focus:outline-none focus:border-accent-gold focus:ring-0 transition-colors rounded-none placeholder:text-on-surface-variant/50 font-body-md text-body-md" id="firstName" name="firstName" placeholder="Jane" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface" for="lastName">Last Name</label>
<input class="w-full bg-transparent border-b border-on-surface-variant/20 py-2 px-0 focus:outline-none focus:border-accent-gold focus:ring-0 transition-colors rounded-none placeholder:text-on-surface-variant/50 font-body-md text-body-md" id="lastName" name="lastName" placeholder="Doe" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Email Address</label>
<input class="w-full bg-transparent border-b border-on-surface-variant/20 py-2 px-0 focus:outline-none focus:border-accent-gold focus:ring-0 transition-colors rounded-none placeholder:text-on-surface-variant/50 font-body-md text-body-md" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full bg-transparent border-b border-on-surface-variant/20 py-2 px-0 pr-8 focus:outline-none focus:border-accent-gold focus:ring-0 transition-colors rounded-none placeholder:text-on-surface-variant/50 font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-accent-gold transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-ink-deep text-surface-cream py-4 px-8 font-label-bold text-label-bold hover:bg-ink-deep/90 transition-all duration-300 flex justify-center items-center group" type="submit">
                                Create Account
                                <span class="material-symbols-outlined ml-2 group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                            Already have an account? 
                            <a class="text-ink-deep font-label-bold text-label-bold border-b border-transparent hover:border-ink-deep transition-colors ml-1" href="#">Sign In</a>
</p>
</div>
</div>
</div>
<!-- Right Side: Imagery -->
<div class="hidden md:block md:w-1/2 relative bg-surface-container-high">
<div class="absolute inset-0 bg-ink-deep/10 z-10"></div>
<img class="object-cover w-full h-full absolute inset-0" data-alt="A pristine, highly organized medical or technical layout viewed from above. Premium grooming tools, precision instruments, and elegant minimal packaging arranged in a rigid grid on a soft cream background. Professional, high-end editorial lighting creating soft shadows, evoking a sense of clinical luxury and sophisticated care." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlCCLbCiGjyaZ0-sdLFCmvGA9ODEC0G7qqloEadGtGwhszCoH1_eN-1i_Q96U5sHaZ8aBHLn8dlOvBeGEx2eaLTAebciLb7-M9l4E1QlVpgH8W57CgVgCS_VZIfA6CE3cPe8WZCOpM85IGaKmj8x4k5XkDCuEMyGFvnlaj7gQGUKsyTWyjFLXh2dc9PAb9XOJot-g5dI4O4L9KI_1UCr8EdPsTxgJBvAdB584rgkyCpejTzXbRUYao6Q"/>
<div class="absolute bottom-margin-desktop left-margin-desktop z-20 max-w-sm text-surface-cream">
<p class="font-headline-md text-headline-md font-bold mb-4">Precision &amp; Elegance</p>
<p class="font-body-lg text-body-lg opacity-90">Experience a new standard of care tailored for the discerning individual.</p>
</div>
</div>
</div>
</main>
</body></html>
