<body class="bg-surface-cream min-h-screen flex items-center justify-center font-body-md text-ink-deep p-margin-mobile md:p-margin-desktop antialiased">
<div class="w-full max-w-md mx-auto flex flex-col items-center">
<!-- Logo -->
<a class="mb-12 text-center group" href="#">
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-ink-deep tracking-tight group-hover:opacity-80 transition-opacity">Flair Vigo</span>
</a>
<!-- Form Container -->
<div class="w-full bg-surface-container-lowest p-8 md:p-12 shadow-sm rounded-lg border border-outline-variant/20">
<div class="mb-8 text-center">
<h1 class="font-headline-md text-headline-md text-ink-deep mb-3">Reset your password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter the email address associated with your account and we'll send you a link to reset your password.
                </p>
</div>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-bold text-label-bold text-ink-deep mb-2" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 bg-neutral-light border-b-2 border-transparent focus:border-accent-gold focus:ring-0 focus:outline-none transition-colors font-body-md text-body-md text-ink-deep placeholder:text-outline-variant rounded-t-sm" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-ink-deep text-surface-cream py-4 px-8 font-label-bold text-label-bold flex items-center justify-center space-x-2 hover:bg-ink-deep/90 hover:scale-[1.01] transition-all duration-200" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<a class="inline-flex items-center space-x-2 font-label-bold text-label-bold text-accent-gold hover:text-ink-deep transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span>Back to Sign In</span>
</a>
</div>
</div>
<!-- Support Link -->
<div class="mt-12 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Having trouble? <a class="text-ink-deep font-label-bold text-label-bold underline underline-offset-4 hover:text-accent-gold transition-colors" href="#">Contact Support</a>
</p>
</div>
</div>
